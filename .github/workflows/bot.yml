name: Infinite AI
on: [push, workflow_dispatch]
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm install
      - name: Run Bot and Push Memory
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          node bot.js &
          # Ждем 2 часа 50 минут перед перезапуском
          sleep 10200
          # Сохраняем память в репозиторий
          git config user.name "AI"
          git config user.email "ai@bot"
          git add memory.json
          git commit -m "update memory"
          git push
          # Перезапускаем цикл
          curl -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          https://api.github.com/repos/${{ github.repository }}/actions/workflows/bot.yml/dispatches \
          -d '{"ref":"main"}'

